[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logometer"
version = "0.1.0"
description = "Tail your logs. Catch anomalies. Skip the 2am grep."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmanSg098" }]
keywords = ["logs", "logging", "anomaly-detection", "monitoring", "cli", "tail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = []  # zero dependencies by design

[project.urls]
Homepage = "https://github.com/AmanSg098/logometer"
Issues = "https://github.com/AmanSg098/logometer/issues"

[project.optional-dependencies]
pretty = ["rich>=13"]  # optional: nicer styled terminal output. --explain needs no extra install (raw HTTP call).

[project.scripts]
logometer = "logometer.cli:main"

[tool.setuptools.packages.find]
include = ["logometer*"]
